---
# Codex CLI 設定

# 推奨設定
codex_approval_policy: "never"
codex_sandbox_mode: "workspace-write"
codex_sandbox_workspace_write_network_access: true
codex_file_opener: "vscode"
codex_preferred_auth_method: "chatgpt"
codex_model_reasoning_effort: "medium"
codex_model_reasoning_summary: "auto"
codex_hide_agent_reasoning: false
codex_show_raw_agent_reasoning: false
codex_history_persistence: "save-all"

# TUIステータスラインの表示項目
# estimated-thread-cost は Enterprise workspace 専用（それ以外では自動的に非表示）
codex_tui_status_line:
  - "model-with-reasoning"
  - "current-dir"
  - "context-usage"
  - "used-tokens"
  - "estimated-thread-cost"
  - "five-hour-limit"
  - "weekly-limit"

# Codex ディレクトリ
codex_dir:
  - "~/.codex"
