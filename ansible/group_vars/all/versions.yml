---
# バージョン定義はこのファイルで一元管理する
# 理由があって固定しているものは、同じ行か直前の行に「固定」とコメントを書く

# install.sh で使用（bootstrap 用）
uv_version: "0.13.6"
pip_packages:
  - "pip==26.2.2"
  - "ansible==14.5.0"
  - "neovim==0.3.1"
  - "pynvim==0.6.0"
  - "python-lsp-server==1.15.0"
  - "sqlparse==0.6.0"
  - "ruff==0.17.3"

# 言語ランタイム
python3_version: "3.14.10"
ruby_version: "4.0.7"
node_version: "22.23.4"
go_version: "1.27.3"

# common
cloud_sql_proxy_version: "2.26.3"

# mise
npm_packages:
  - "bash-language-server@5.8.1"
  - "vscode-langservers-extracted@4.10.0"
  - "typescript-language-server@6.0.2"
  - "typescript@5.9.3"

go_packages:
  # sqls は v0.2.20 固定。新しいバージョンでは 1 行目がコメント行だと 2 行目以降のクエリが実行できない
  # （https://github.com/sqls-server/sqls/issues/178 、v0.2.48 以降はモジュールパスも github.com/sqls-server/sqls に変わっている）
  - "github.com/lighttiger2505/sqls@v0.2.20"
  - "golang.org/x/tools/gopls@v0.24.0"
  - "github.com/x-motemen/gore/cmd/gore@v0.7.0"
  - "github.com/go-delve/delve/cmd/dlv@v1.27.2"

# tmux バージョン (リリースタグを指定)
tmux_version: "3.7b"

# neovim
neovim_version: "0.12.6"
oxker_version: "0.13.4"
lazygit_version: "0.66.2"
tree_sitter_cli_version: "0.27.1"
