---
# tmux_version は ansible/group_vars/all/versions.yml で管理
tmux_apt_pkg:
  - automake
  - bison
  - build-essential
  - pkg-config
  - libevent-dev
  - libncurses5-dev
tmux_brew_pkg:
  - automake
tmux_main_dir: "~/"
# tmux セッション起動時に開く window を定義する
# - dir: tmux の -c で指定する作業ディレクトリ（必須）
# - command: 起動時に send-keys で送信するコマンド文字列（任意）
# 注意: command にダブルクォートや特殊文字を含めると生成される .tmux.conf を破損させる可能性があるため避けること
tmux_windows:
  - dir: "~/src"
  - dir: "~/.local/share/nvim"
    command: "nvim ~/.local/share/nvim/common.sql"

