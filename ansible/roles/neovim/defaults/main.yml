---
# バージョンと neovim_plugins は ansible/group_vars/all/versions.yml で管理
neovim_plugin_path: "~/.local/share/nvim/site/pack/plugins/start"
neovim_dir:
  - "{{ neovim_plugin_path }}"
  - "~/.config/nvim"
  - "~/.config/sqls"
  - "~/.config/lazygit"
  - "/usr/local/src/nvim"
  - "~/.local/share/nvim/sessions"
# nvim-treesitter でインストールするパーサー
neovim_treesitter_parsers:
  - "ruby"
  - "go"
  - "typescript"
  - "javascript"
  - "python"
  - "lua"
  - "bash"
db_user: "postgres"
db_password: ""
db_dbname: "postgres"
